const SHORT_URL_CACHE_KEY='brawl-draft-quiz-short-url-v2',SHORT_URL_HOSTS=new Set(['spoo.me','cleanuri.com']);

  });

  if(parts.length===1){if(x==='top'||x==='bottom'){y=x;x='50%'}else y='50%'}else if((x==='top'||x==='bottom')&&(y==='left'||y==='right'||y==='center')){const swap=x;x=y;y=swap}
  const dx=pl+exportObjectPositionOffset(x,cw-dw),dy=pt+exportObjectPositionOffset(y,ch-dh);
  ctx.save();ctx.filter=style.filter&&style.filter!=='none'?style.filter:'none';
  if(style.backgroundColor&&style.backgroundColor!=='transparent'&&style.backgroundColor!=='rgba(0, 0, 0, 0)'){ctx.fillStyle=style.backgroundColor;ctx.fillRect(0,0,w,h)}
  ctx.beginPath();ctx.rect(pl,pt,cw,ch);ctx.clip();ctx.drawImage(img,dx,dy,dw,dh);ctx.restore();return out.toDataURL('image/png');
}
async function buildExportCanvas(){
  const source=document.getElementById('canvas');await waitForCanvasAssets(source);const clone=source.cloneNode(true);clone.id='canvasExport';clone.style.width='1920px';clone.style.height='1080px';clone.style.transform='none';
  clone.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));const sourceImages=[...source.querySelectorAll('img')],cloneImages=[...clone.querySelectorAll('img')];
  sourceImages.forEach((img,i)=>{try{const data=rasterizeImageForExport(img);if(!data||!cloneImages[i])return;cloneImages[i].removeAttribute('srcset');cloneImages[i].removeAttribute('crossorigin');cloneImages[i].src=data;cloneImages[i].style.objectFit='fill';cloneImages[i].style.objectPosition='center';cloneImages[i].style.filter='none'}catch(e){console.warn('export image',e)}});
  clone.querySelectorAll('.editable').forEach(el=>{el.style.transition='none';el.style.filter='none';el.style.boxShadow='none'});
  const host=document.createElement('div');host.setAttribute('aria-hidden','true');host.style.position='fixed';host.style.left='0';host.style.top='0';host.style.width='1920px';host.style.height='1080px';host.style.zIndex='-2147483648';host.style.pointerEvents='none';host.appendChild(clone);document.body.appendChild(host);await waitForCanvasAssets(clone);return {host,canvas:clone};
}
function renderExportWithSvg(source){
  return new Promise((resolve,reject)=>{
    const css=[...document.querySelectorAll('style')].map(x=>x.textContent||'').join('\n').replace(/]]>/g,'] ]>');
    const html=new XMLSerializer().serializeToString(source),svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><div xmlns="http://www.w3.org/1999/xhtml"><style><![CDATA[${css}]]></style>${html}</div></foreignObject></svg>`;
    const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'})),img=new Image(),finish=()=>URL.revokeObjectURL(url);
    img.onload=()=>{try{const out=document.createElement('canvas');out.width=1920;out.height=1080;out.getContext('2d').drawImage(img,0,0,1920,1080);finish();resolve(out)}catch(e){finish();reject(e)}};img.onerror=()=>{finish();reject(new Error('내장 PNG 렌더러가 이미지를 만들지 못했습니다.'))};img.src=url;
  });
}
async function downloadPNG(){
  if(!requireMysteryAnswer())return;toast('이미지 생성 중…');let exportHost;
  try{const built=await buildExportCanvas();exportHost=built.host;let c;if(typeof window.html2canvas==='function'){try{c=await window.html2canvas(built.canvas,{backgroundColor:null,scale:1,width:1920,height:1080,windowWidth:1920,windowHeight:1080,scrollX:0,scrollY:0,useCORS:true,allowTaint:false,foreignObjectRendering:true,imageTimeout:15000,logging:false})}catch(e){console.warn('html2canvas fallback',e);c=await renderExportWithSvg(built.canvas)}}else c=await renderExportWithSvg(built.canvas);const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='draft-quiz-'+Date.now()+'.png';a.click();a.remove();toast('PNG 저장 완료')}
  catch(e){console.error(e);alert('PNG 생성에 실패했습니다. 외부 팀 로고가 CORS를 허용하지 않는 경우 직접 업로드한 로고를 사용해 주세요.')}
  finally{exportHost?.remove()}
}
function swapSides(){[state.teams.left,state.teams.right]=[state.teams.right,state.teams.left];[['lg1','rg1'],['lg2','rg2'],['lb1','rb1'],['lb2','rb2'],['lb3','rb3'],['lp1','rp1'],['lp2','rp2'],['lp3','rp3']].forEach(([a,b])=>[state.slots[a],state.slots[b]]=[state.slots[b],state.slots[a]]);const q={lp1:'rp1',lp2:'rp2',lp3:'rp3',rp1:'lp1',rp2:'lp2',rp3:'lp3'};state.questionSlots=activeQuestionSlots().map(k=>q[k]||k);syncMysteryAnswers();render()}
