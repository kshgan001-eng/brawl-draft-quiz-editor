.modal{width:min(940px,96vw);max-height:88vh;background:#15181d;border:1px solid #343943;border-radius:18px;box-shadow:0 24px 90px #000c;display:flex;flex-direction:column;overflow:hidden}.modal-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid #30343c}.modal-head h2{font-size:18px;margin:0;font-weight:950}.modal-head .sub{font-size:11px;color:#9299a5}.close{margin-left:auto;border:0;background:#272c34;color:#fff;border-radius:9px;width:36px;height:36px;font-size:22px}.modal-body{padding:16px;overflow:auto}
.searchbar{display:flex;gap:8px;margin-bottom:12px}.searchbar input,.field input{width:100%;border:1px solid #3b414b;background:#0f1115;color:#fff;border-radius:10px;padding:11px 12px;outline:none}.searchbar input:focus,.field input:focus{border-color:#7b8493}
.tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}.tab{border:1px solid #363b44;background:#20242a;color:#cfd3da;border-radius:999px;padding:8px 12px;font-weight:850;font-size:12px}.tab.active{background:#fff;color:#111;border-color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:9px}.card{position:relative;border:1px solid #333943;background:#1c2026;border-radius:12px;overflow:hidden;min-height:126px;color:#fff;text-align:left;padding:0}.card:hover{border-color:#8a93a2;transform:translateY(-1px)}.card.selected{border-color:#fff;box-shadow:inset 0 0 0 2px #fff}.card img{width:100%;height:95px;object-fit:contain;object-position:center;display:block;background:#252a31;padding:2px}

.form{display:grid;gap:12px}.field label{display:block;color:#b4bac4;font-size:11px;font-weight:900;margin:0 0 6px}.field .hint{font-size:10px;color:#7f8793;margin-top:5px;line-height:1.45}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.upload{border:1px dashed #4b5360;background:#191d23;border-radius:12px;padding:14px;text-align:center}.upload input{display:none}.upload label{cursor:pointer;font-weight:900;color:#dfe3e8}.note{font-size:11px;line-height:1.55;color:#8f97a3;background:#111419;border:1px solid #2b3038;border-radius:10px;padding:10px 12px;margin-bottom:12px}
.preview-mode .topbar{display:none}.preview-mode .workspace{padding:0;min-height:100vh;background:#202124;align-items:flex-start}.preview-mode .canvas-wrap{box-shadow:none}.preview-mode .editable{cursor:default}.preview-mode .editable:hover{filter:none;box-shadow:none}

<body>
<header class="topbar" id="topbar">
  <div class="brand">드래프트 퀴즈 편집기<small>원하는 곳을 클릭해서 바로 수정</small></div>
  <button class="tb primary" id="previewBtn">미리보기</button>
  <button class="tb" id="pngBtn">PNG 저장</button>
  <button class="tb" id="shareBtn">편집 링크 공유</button>
  <button class="tb" id="quizBtn">퀴즈 링크 공유</button>
  <button class="tb" id="swapBtn">좌우 교체</button>
  <button class="tb danger" id="resetBtn">전부 비우기</button>
</header>
<main class="workspace" id="workspace">
  <div class="stage" id="stage"><div class="canvas-wrap" id="canvasWrap"><div class="canvas" id="canvas">
    <div class="frame global-left"><div class="global-ban-top"><div id="lg1" class="editable" data-slot="lg1"></div><div id="lg2" class="editable" data-slot="lg2"></div></div></div>
    <div class="frame global-right"><div class="global-ban-top"><div id="rg1" class="editable" data-slot="rg1"></div><div id="rg2" class="editable" data-slot="rg2"></div></div></div>

    <div class="frame ban left-ban-1 editable" id="lb1" data-slot="lb1"></div>
    <div class="frame ban left-ban-2 editable" id="lb2" data-slot="lb2"></div>
    <div class="frame ban left-ban-3 editable" id="lb3" data-slot="lb3"></div>

    <div class="frame left-pick-1 editable" id="lp1" data-slot="lp1"></div>
    <div class="frame left-pick-2 editable" id="lp2" data-slot="lp2"></div>
    <div class="frame left-pick-3 editable" id="lp3" data-slot="lp3"></div>

    <div class="frame map-title">
      <div class="mode-icon editable empty" id="modeIconCell" data-edit="mode"><img id="modeIconImg" alt=""></div>
      <div class="map-title-text editable" id="mapTitle" data-edit="map"></div>
    </div>
    <div class="frame map-frame editable" data-edit="map"><div class="asset empty" id="mapAsset"><img id="mapImg" alt=""></div></div>

    <div class="frame right-pick-1 editable" id="rp1" data-slot="rp1"></div>
    <div class="frame right-pick-2 editable" id="rp2" data-slot="rp2"></div>
    <div class="frame right-pick-3 editable" id="rp3" data-slot="rp3"></div>

    <div class="frame ban right-ban-1 editable" id="rb1" data-slot="rb1"></div>
    <div class="frame ban right-ban-2 editable" id="rb2" data-slot="rb2"></div>
    <div class="frame ban right-ban-3 editable" id="rb3" data-slot="rb3"></div>

    <div class="frame team-left editable" data-team="left"><div class="team-left-name" id="leftTeamName"></div><div class="team-logo-cell empty" id="leftLogoCell"></div></div>
    <div class="frame center-score"><div class="center-blue" id="leftAbbr"></div><div class="center-red" id="rightAbbr"></div></div>
    <div class="frame team-right editable" data-team="right"><div class="team-logo-cell empty" id="rightLogoCell"></div><div class="team-right-name" id="rightTeamName"></div></div>
  </div></div></div>
</main>

<div class="modal-backdrop" id="modalBackdrop"><section class="modal"><div class="modal-head"><div><h2 id="modalTitle">편집</h2><div class="sub" id="modalSub"></div></div><button class="close" id="modalClose">×</button></div><div class="modal-body" id="modalBody"></div></section></div>
<div class="toast" id="toast"></div>

<script>

function openBrawler(slotKey){
  openModal(SLOT_NAMES[slotKey],'브롤러를 검색하거나 초상화를 눌러 선택하세요.');
  modalBody.innerHTML=`<div class="searchbar"><input id="brawlerSearch" placeholder="브롤러 한국어/영문 이름 검색"></div><div id="brawlerGrid" class="grid"></div><div class="actions"><button class="action red" id="clearSlot">이 칸 비우기</button></div>`;
  const search=document.getElementById('brawlerSearch'),grid=document.getElementById('brawlerGrid');
  const draw=()=>{
    const q=normalize(search.value);
    const list=brawlers.filter(b=>{const ko=brawlerKoName(b);return !q||normalize(b.name).includes(q)||normalize(ko).includes(q)});
    grid.innerHTML='';
    if(PICK_SLOTS.includes(slotKey)){
      const selected=state.questionSlot===slotKey;
      const mysteryBtn=makeMysteryCard('미스테리 픽');
      mysteryBtn.classList.toggle('selected',selected);mysteryBtn.setAttribute('aria-pressed',String(selected));
      mysteryBtn.onclick=()=>{state.slots[slotKey]=blankSlot();state.questionSlot=selected?'':slotKey;render();closeModal()};
      grid.appendChild(mysteryBtn);
    }
    if(!brawlers.length){grid.insertAdjacentHTML('beforeend','<div class="loading">브롤러 목록을 불러오는 중…</div>');return}
    if(!list.length){grid.insertAdjacentHTML('beforeend','<div class="empty-result">검색 결과가 없습니다.</div>');return}
    list.sort((a,b)=>brawlerKoName(a).localeCompare(brawlerKoName(b),'ko')).forEach(b=>{
      const btn=document.createElement('button'),id=String(b.id||''),img=brawlerImage(b),thumb=brawlerThumb(b),ko=brawlerKoName(b);
      const selected=state.questionSlot!==slotKey&&String(state.slots[slotKey]?.id||'')===id;
      btn.className='card';btn.classList.toggle('selected',selected);btn.setAttribute('aria-pressed',String(selected));
      btn.innerHTML=`<img crossorigin="anonymous" src="${escAttr(thumb)}" alt=""><div class="label">${esc(ko)}</div><div class="sub-label">${esc(b.name||'')}</div>`;
      btn.onclick=()=>{state.questionSlot=state.questionSlot===slotKey?'':state.questionSlot;state.slots[slotKey]=selected?blankSlot():{name:ko,id,image:img};render();closeModal()};
      grid.appendChild(btn);
    });
  };
  search.oninput=draw;draw();
  document.getElementById('clearSlot').onclick=()=>{state.slots[slotKey]=blankSlot();if(state.questionSlot===slotKey)state.questionSlot='';render();closeModal()};
}

function normalizeCorestatsRegion(value){const raw=String(value||'').trim();const key=raw.toUpperCase();const aliases={'EAST ASIA':'EA','EUROPE':'EMEA','EUROPE, MIDDLE EAST & AFRICA':'EMEA','NORTH AMERICA':'NA','SOUTH AMERICA':'SA','SOUTHEAST ASIA':'SEA','SOUTH EAST ASIA':'SEA','CHINA':'CN','SOUTH ASIA':'SAS'};return aliases[key]||key}
function teamRegionTabs(){return TEAM_REGIONS.map(r=>`<button class="tab ${activeTeamRegion===r.code?'active':''}" data-team-region="${r.code}">${r.label}</button>`).join('')}
function normalizeCorestatsTeam(x){
  if(!x)return null;
  const name=String(x.name||x.teamName||x.title||x.code||'').trim();
  const code=String(x.code||x.shortName||x.abbr||name).trim();
  let logo=String(x.logo||x.logoUrl||x.logo_url||x.image||x.imageUrl||'').trim();
  if(logo&&logo.startsWith('/'))logo='https://corestats.pro'+logo;
  if(!name&&!code)return null;
  return {name:name||code,code:code||name,logo,region:normalizeCorestatsRegion(x.region||x.zone||''),winRate:String(x.winRate||x.win_rate||'').trim(),wins:String(x.wins||'').trim(),matches:String(x.matches||x.totalMatches||x.total_matches||'').trim(),page:x.page||`https://corestats.pro/team/${encodeURIComponent(code||name)}`};
}
function extractCorestatsTeamsFromHtml(html){
  const out=[];const doc=new DOMParser().parseFromString(html,'text/html');
  doc.querySelectorAll('a[href*="/team/"]').forEach(a=>{
    const href=a.getAttribute('href')||'';const code=decodeURIComponent(href.split('/team/')[1]?.split(/[?#/]/)[0]||'').trim();if(!code||code.includes('$'))return;
    let box=a;for(let i=0;i<5&&box.parentElement;i++){if(box.querySelector?.('img'))break;box=box.parentElement}
    const img=box.querySelector?.('img');let logo=img?.getAttribute('src')||img?.getAttribute('data-src')||'';
    if(logo&&logo.startsWith('/'))logo='https://corestats.pro'+logo;
    const text=(a.textContent||box.textContent||'').replace(/\s+/g,' ').trim();out.push({name:text&&text.length<60?text:code,code,logo});
  });
  const text=html.replace(/\\u002F/g,'/').replace(/\\\//g,'/');
  const re=/[\"'](?:name|teamName)[\"']\s*:\s*[\"']([^\"']+)[\"'][\s\S]{0,600}?[\"'](?:code|abbr|shortName)[\"']\s*:\s*[\"']([^\"']+)[\"'][\s\S]{0,900}?[\"'](?:logo|logoUrl|image|imageUrl)[\"']\s*:\s*[\"']([^\"']+)[\"']/gi;
  let m;while((m=re.exec(text))){out.push({name:m[1],code:m[2],logo:m[3].startsWith('/')?'https://corestats.pro'+m[3]:m[3]})}
  const uniq=new Map();out.map(normalizeCorestatsTeam).filter(Boolean).forEach(t=>{const k=(t.code||t.name).toUpperCase();const old=uniq.get(k);if(!old||(!old.logo&&t.logo))uniq.set(k,t)});return [...uniq.values()];
}
async function loadCorestatsTeams(force=false){
  if(corestatsTeams.length&&!force)return corestatsTeams;
  const target='https://corestats.pro/api/teams';
  const urls=[target,'https://api.allorigins.win/raw?url='+encodeURIComponent(target)];
  for(const url of urls){try{const r=await fetch(url,{mode:'cors',cache:'no-store'});if(!r.ok)continue;const text=await r.text();let found=[];try{const j=JSON.parse(text);const list=Array.isArray(j)?j:(j.teams||j.data||j.list||[]);found=list.map(normalizeCorestatsTeam).filter(Boolean)}catch{found=extractCorestatsTeamsFromHtml(text)}if(found.length){corestatsTeams=found;return found}}catch(e){console.warn('Corestats fetch',url,e)}}
  corestatsTeams=CORESTATS_TEAM_SNAPSHOT.map(normalizeCorestatsTeam).filter(Boolean);return corestatsTeams;
}
function drawCorestatsTeams(root,teams,onPick){

function resizeUpload(file){return new Promise((resolve,reject)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const max=320,s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);resolve(c.toDataURL('image/webp',.88))};img.onerror=reject;img.src=u})}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escAttr(s){return esc(s)}

async function loadBrawlers(){const urls=['https://api.brawlapi.com/v1/brawlers','https://brawlapi-v1.pages.dev/v1/brawlers'];for(const url of urls){try{const r=await fetch(url,{cache:'default'});if(!r.ok)continue;const j=await r.json();const list=Array.isArray(j.list)?j.list:Array.isArray(j)?j:[];if(list.length){brawlers=list.filter(x=>x&&x.released!==false);brawlers.sort((a,b)=>brawlerKoName(a).localeCompare(brawlerKoName(b),'ko'));return}}catch(e){console.warn('brawlers',url,e)}}toast('브롤러 목록 연결에 실패했습니다. 네트워크 상태를 확인해 주세요.')}
async function loadMaps(){const urls=['https://api.brawlapi.com/v1/maps','https://brawlapi-v1.pages.dev/v1/maps'];for(const url of urls){try{const r=await fetch(url,{cache:'default'});if(!r.ok)continue;const j=await r.json();const list=Array.isArray(j.list)?j.list:Array.isArray(j)?j:[];if(list.length){maps=list;return}}catch(e){console.warn('maps',url,e)}}toast('맵 목록 연결에 실패했습니다. 네트워크 상태를 확인해 주세요.')}

function quizState(){const c=safeClone(state);if(c.questionSlot&&c.slots[c.questionSlot])c.slots[c.questionSlot]=blankSlot();return c}
function waitForImageReady(img){
  if(img.complete)return img.decode?img.decode().catch(()=>{}):Promise.resolve();
  return new Promise(resolve=>{let done=false;const finish=()=>{if(done)return;done=true;resolve()};img.addEventListener('load',finish,{once:true});img.addEventListener('error',finish,{once:true});setTimeout(finish,8000)});
}
async function waitForCanvasAssets(root){
  try{if(document.fonts?.ready)await document.fonts.ready}catch{}
  await Promise.all([...root.querySelectorAll('img')].filter(img=>img.style.display!=='none').map(waitForImageReady));
}
function exportObjectPositionOffset(token,freeSpace){
  const value=String(token||'50%').toLowerCase();
  if(value==='left'||value==='top')return 0;if(value==='right'||value==='bottom')return freeSpace;if(value==='center')return freeSpace*.5;
  if(value.endsWith('%'))return freeSpace*(parseFloat(value)||0)/100;const px=parseFloat(value);return Number.isFinite(px)?px:freeSpace*.5;
}
function rasterizeImageForExport(img){
  const style=getComputedStyle(img),w=Math.round(img.offsetWidth),h=Math.round(img.offsetHeight),nw=img.naturalWidth,nh=img.naturalHeight;
  if(style.display==='none'||!w||!h||!nw||!nh)return '';
  const out=document.createElement('canvas');out.width=w;out.height=h;const ctx=out.getContext('2d');
  const pl=parseFloat(style.paddingLeft)||0,pr=parseFloat(style.paddingRight)||0,pt=parseFloat(style.paddingTop)||0,pb=parseFloat(style.paddingBottom)||0;
  const cw=Math.max(1,w-pl-pr),ch=Math.max(1,h-pt-pb),fit=style.objectFit||'fill';let dw=cw,dh=ch;
  if(fit==='contain'||fit==='cover'||fit==='scale-down'){let scale=fit==='cover'?Math.max(cw/nw,ch/nh):Math.min(cw/nw,ch/nh);if(fit==='scale-down')scale=Math.min(1,scale);dw=nw*scale;dh=nh*scale}else if(fit==='none'){dw=nw;dh=nh}
  const parts=String(style.objectPosition||'50% 50%').trim().split(/\s+/);let x=parts[0]||'50%',y=parts[1]||'50%';
  if(parts.length===1){if(x==='top'||x==='bottom'){y=x;x='50%'}else y='50%'}else if((x==='top'||x==='bottom')&&(y==='left'||y==='right'||y==='center')){const swap=x;x=y;y=swap}
  const dx=pl+exportObjectPositionOffset(x,cw-dw),dy=pt+exportObjectPositionOffset(y,ch-dh);
  ctx.save();ctx.filter=style.filter&&style.filter!=='none'?style.filter:'none';
  if(style.backgroundColor&&style.backgroundColor!=='transparent'&&style.backgroundColor!=='rgba(0, 0, 0, 0)'){ctx.fillStyle=style.backgroundColor;ctx.fillRect(0,0,w,h)}
  ctx.beginPath();ctx.rect(pl,pt,cw,ch);ctx.clip();ctx.drawImage(img,dx,dy,dw,dh);ctx.restore();return out.toDataURL('image/png');
}
async function buildExportCanvas(){
  const source=document.getElementById('canvas');await waitForCanvasAssets(source);const clone=source.cloneNode(true);clone.id='canvasExport';clone.style.width='1920px';clone.style.height='1080px';clone.style.transform='none';
  clone.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));const sourceImages=[...source.querySelectorAll('img')],cloneImages=[...clone.querySelectorAll('img')];
  sourceImages.forEach((img,i)=>{try{const data=rasterizeImageForExport(img);if(!data||!cloneImages[i])return;cloneImages[i].removeAttribute('srcset');cloneImages[i].removeAttribute('crossorigin');cloneImages[i].src=data;cloneImages[i].style.objectFit='fill';cloneImages[i].style.objectPosition='center';cloneImages[i].style.filter='none'}catch(e){console.warn('export image',e)}});
  clone.querySelectorAll('.editable').forEach(el=>{el.style.transition='none';el.style.filter='none';el.style.boxShadow='none'});
  const host=document.createElement('div');host.setAttribute('aria-hidden','true');host.style.position='fixed';host.style.left='0';host.style.top='0';host.style.width='1920px';host.style.height='1080px';host.style.zIndex='-2147483648';host.style.pointerEvents='none';host.appendChild(clone);document.body.appendChild(host);await waitForCanvasAssets(clone);return {host,canvas:clone};
}
async function downloadPNG(){
  toast('이미지 생성 중…');let exportHost;
  try{const built=await buildExportCanvas();exportHost=built.host;const c=await html2canvas(built.canvas,{backgroundColor:null,scale:1,width:1920,height:1080,windowWidth:1920,windowHeight:1080,scrollX:0,scrollY:0,useCORS:true,allowTaint:false,foreignObjectRendering:true,imageTimeout:15000,logging:false});const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='draft-quiz-'+Date.now()+'.png';a.click();a.remove();toast('PNG 저장 완료')}
  catch(e){console.error(e);alert('PNG 생성에 실패했습니다. 외부 팀 로고가 CORS를 허용하지 않는 경우 직접 업로드한 로고를 사용해 주세요.')}
  finally{exportHost?.remove()}
}
function swapSides(){[state.teams.left,state.teams.right]=[state.teams.right,state.teams.left];[['lg1','rg1'],['lg2','rg2'],['lb1','rb1'],['lb2','rb2'],['lb3','rb3'],['lp1','rp1'],['lp2','rp2'],['lp3','rp3']].forEach(([a,b])=>[state.slots[a],state.slots[b]]=[state.slots[b],state.slots[a]]);const q={lp1:'rp1',lp2:'rp2',lp3:'rp3',rp1:'lp1',rp2:'lp2',rp3:'lp3'};state.questionSlot=q[state.questionSlot]||state.questionSlot;render()}
function resizePreview(){if(document.body.classList.contains('preview-mode')){const s=Math.min(innerWidth/1920,innerHeight/1080);canvasWrap.style.transform=`scale(${s})`;stage.style.width=1920*s+'px';stage.style.height=1080*s+'px';return}const maxW=Math.max(300,workspace.clientWidth-44);const s=Math.min(1,maxW/1920);canvasWrap.style.transform=`scale(${s})`;stage.style.width=1920*s+'px';stage.style.height=1080*s+'px'}

canvas.addEventListener('click',e=>{if(document.body.classList.contains('preview-mode'))return;const slot=e.target.closest('[data-slot]');if(slot)return openBrawler(slot.dataset.slot);const team=e.target.closest('[data-team]');if(team)return openTeam(team.dataset.team);const edit=e.target.closest('[data-edit]');if(edit?.dataset.edit==='map')return openMap();if(edit?.dataset.edit==='mode')return openMode()});
document.getElementById('previewBtn').onclick=()=>window.open(shareUrl(state,true),'_blank');document.getElementById('pngBtn').onclick=downloadPNG;document.getElementById('shareBtn').onclick=()=>copy(shareUrl(state,false),'편집 링크를 복사했습니다.');document.getElementById('quizBtn').onclick=()=>{if(!state.questionSlot){toast('먼저 픽 칸 하나를 미스테리로 설정하세요.');return}copy(shareUrl(quizState(),true),'퀴즈 링크를 복사했습니다.')};document.getElementById('swapBtn').onclick=swapSides;document.getElementById('resetBtn').onclick=()=>{if(confirm('모든 내용을 공백으로 초기화할까요?')){state=blankState();render();toast('전부 비웠습니다.')}};

state=load();if(!state.slots)state=blankState();if(!state.colors)state.colors=blankState().colors;
if(new URLSearchParams(location.search).get('preview')==='1')document.body.classList.add('preview-mode');
render();loadBrawlers();loadMaps();addEventListener('resize',resizePreview);
</script>
